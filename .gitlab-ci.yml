stages:
  - verify
  - build

include:
  - local: /.gitlab/ci/user.yml
  - local: /.gitlab/ci/approval.yml

check-ci-environment:
  stage: verify
  image: eclipse-temurin:21-jdk

  tags:
    - nexa-ci

  script:
    - echo "NEXA CI environment check"
    - java -version

  rules:
    - when: manual

  allow_failure: true