server:
  port: 8082
spring:
  cloud:
    config:
      enabled: false

  application:
    name: leave-service


  datasource:
    url: jdbc:postgresql://localhost:5433/nexa_leave
    username: nexa_leave_app
    password: ${LEAVE_DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never