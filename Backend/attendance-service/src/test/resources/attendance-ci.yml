spring:
  application:
    name: attendance-service

  cloud:
    config:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

eureka:
  client:
    enabled: false

attendance:
  clients:
    approval:
      base-url: http://localhost:8083