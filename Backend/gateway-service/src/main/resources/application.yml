
server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 유저 서비스 (8081)
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/{version:v[0-9]+}/users/**,/api/{version:v[0-9]+}/auth/**

            # 휴가 서비스 (8082)
            - id: leave-service
              uri: ${LEAVE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/{version:v[0-9]+}/leaves/**

            # 결재 서비스 (8083)
            - id: approval-service
              uri: ${APPROVAL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/{version:v[0-9]+}/approvals/**

            # 근태 서비스 (8084)
            - id: attendance-service
              uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/{version:v[0-9]+}/attendance/**

            # 급여 서비스 (8085)
            - id: payroll-service
              uri: ${PAYROLL_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/{version:v[0-9]+}/payroll/**

            # AI 서비스 (8086)
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/{version:v[0-9]+}/ai/**

# HS256 JWT 공통 설정
security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:askdjfhakshdhakjshdjkfhjakshdjkfjakshdjkfhjkasdkjfhjkasdhfjkhkjlasdhfkjhjk}
    issuer: nexa-auth
