spring.application.name=migration-service
server.port=${SERVER_PORT:8087}

# Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://admin:1234@localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# DB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/nexa_migration}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexa_migration_app}
spring.datasource.password=${MIGRATION_DB_PASSWORD}

# JPA (스키마는 Flyway가 관리)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 업로드
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 매핑 추천 LLM (OpenAI Responses API 형식). 키가 없으면 동의어 추천만 쓴다. 키는 환경변수로만
migration.llm.base-url=${MIGRATION_LLM_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
migration.llm.model=${MIGRATION_LLM_MODEL:gpt-6-luna}
migration.llm.api-key=${GMS_KEY:}

# 이관 대상 서비스 (이관용 내부 API). Eureka 연동 전까지 직접 주소
migration.targets.hr.base-url=${HR_SERVICE_URL:http://localhost:8081}
