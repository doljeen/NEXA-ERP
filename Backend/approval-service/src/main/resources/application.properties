spring.application.name=approval-service
server.port=8083

# Local PostgreSQL (docker container approval-service-postgres, host port 15433)
spring.datasource.url=jdbc:postgresql://localhost:15433/approval_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# HTTP로 상태 확인 기능만 제공
management.endpoints.web.exposure.include=health

# 응답에는 상세 정보 대신 전체 상태만 표시
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never