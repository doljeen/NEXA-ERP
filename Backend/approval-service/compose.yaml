services:
  postgres:
    image: postgres:17-alpine
    container_name: approval-service-postgres
    environment:
      POSTGRES_DB: approval_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 호스트 5432 는 로컬 PostgreSQL, 15432 는 user-service 가 사용 중이라 15433 으로 노출
      - "15433:5432"
    volumes:
      - approval-service-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d approval_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: approval-service-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/approval_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8083:8083"
    restart: unless-stopped

volumes:
  approval-service-pgdata:
