services:
  fastapi:
    build:
      context: ./FastAPI
    image: nexa-fastapi:local

    restart: unless-stopped

    ports:
      - "127.0.0.1:8086:8086"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8086/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"