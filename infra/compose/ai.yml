services:
  fastapi:
    build:
      context: ./FastAPI
    image: nexa-fastapi:local

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nexa_ai
      DB_USER: nexa_ai_app
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}

      EUREKA_SERVER_URL: "http://${EUREKA_USER:?EUREKA_USER is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@eureka-server:8761/eureka/"
      INSTANCE_HOST: fastapi
      INSTANCE_PORT: "8086"

      UPLOAD_DIR: /app/uploads
      LLM_TEST_API_ENABLED: "false"

    volumes:
      - fastapi-uploads:/app/uploads

    ports:
      - "127.0.0.1:8086:8086"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8086/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fastapi-uploads: