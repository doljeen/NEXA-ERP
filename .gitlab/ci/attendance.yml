build-attendance:
  extends: .testcontainers
  stage: build
  image: eclipse-temurin:21-jdk

  tags:
    - nexa-ci

  script:
    - cd Backend/attendance-service
    - bash gradlew --no-daemon test bootJar

  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: Backend/attendance-service/build/test-results/test/TEST-*.xml

  when: manual
  allow_failure: true