build-approval:
  extends: .testcontainers
  stage: build
  image: eclipse-temurin:21-jdk

  tags:
    - nexa-ci

  variables:
    EUREKA_CLIENT_ENABLED: "false"

  script:
    - cd Backend/approval-service
    - bash gradlew --no-daemon test bootJar

  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: Backend/approval-service/build/test-results/test/TEST-*.xml

  when: manual
  allow_failure: true