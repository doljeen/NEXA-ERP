build-config:
  stage: build
  image: eclipse-temurin:21-jdk

  tags:
    - nexa-ci

  variables:
    SPRING_PROFILES_ACTIVE: native
    CONFIG_SERVER_PASSWORD: ci_test_password

  script:
    - cd Backend/config-server
    - bash gradlew --no-daemon test bootJar

  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: Backend/config-server/build/test-results/test/TEST-*.xml

  when: manual
  allow_failure: true