name: nexa

services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    environment:
      POSTGRES_DB: nexa_dev
      POSTGRES_USER: nexa_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD:?LEAVE_DB_PASSWORD is required}
      APPROVAL_DB_PASSWORD: ${APPROVAL_DB_PASSWORD:?APPROVAL_DB_PASSWORD is required}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?ATTENDANCE_DB_PASSWORD is required}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?PAYROLL_DB_PASSWORD is required}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  user-service:
    build:
      context: ./Backend/user-service
    image: nexa-user:local

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_user
      SPRING_DATASOURCE_USERNAME: nexa_user_app
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      EUREKA_URL: "http://${EUREKA_USER:?EUREKA_USER is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@eureka-server:8761/eureka/"

    ports:
      - "127.0.0.1:8081:8081"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  approval-service:
    build:
      context: ./Backend/approval-service
    image: nexa-approval:local

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexa_approval
      SPRING_DATASOURCE_USERNAME: nexa_approval_app
      SPRING_DATASOURCE_PASSWORD: ${APPROVAL_DB_PASSWORD:?APPROVAL_DB_PASSWORD is required}
      EUREKA_URL: "http://${EUREKA_USER:?EUREKA_USER is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@eureka-server:8761/eureka/"

    ports:
      - "127.0.0.1:8083:8083"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  fastapi:
    build:
      context: ./FastAPI
    image: nexa-fastapi:local

    restart: unless-stopped

    ports:
      - "127.0.0.1:8086:8086"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8086/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  eureka-server:
    build:
      context: ./Backend/eureka-server
    image: nexa-eureka:local

    restart: unless-stopped

    environment:
      SERVER_PORT: "8761"
      EUREKA_USER: ${EUREKA_USER:?EUREKA_USER is required}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}

    ports:
      - "127.0.0.1:8761:8761"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  config-server:
    build:
      context: ./Backend/config-server
    image: nexa-config:local

    restart: unless-stopped

    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:?CONFIG_GIT_URI is required}
      CONFIG_GIT_PRIVATE_KEY: ${CONFIG_GIT_PRIVATE_KEY:?CONFIG_GIT_PRIVATE_KEY is required}
      GITHUB_SSH_HOST_KEY: ${GITHUB_SSH_HOST_KEY:?GITHUB_SSH_HOST_KEY is required}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}

    ports:
      - "127.0.0.1:8888:8888"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway-service:
    build:
      context: ./Backend/gateway-service
    image: nexa-gateway:local

    restart: unless-stopped

    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD is required}

      JWT_JWKS_URI: http://user-service:8081/.well-known/jwks.json

      EUREKA_SERVER_URL: "http://${EUREKA_USER:?EUREKA_USER is required}:${EUREKA_PASSWORD:?EUREKA_PASSWORD is required}@eureka-server:8761/eureka/"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"

    ports:
      - "127.0.0.1:8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data: